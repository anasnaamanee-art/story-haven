/* ============================================================
   UPLOAD D'IMAGE
   ============================================================ */
let mediaTarget = 'main'; // 'main' | 'modal'
function processImage(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const max = 1000;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        res(canvas.toDataURL('image/jpeg', .78));
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}
$('#fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Seules les images sont acceptées', 'error'); return; }
  toast('Traitement de l\'image…');
  try {
    const dataUrl = await processImage(file);
    if (mediaTarget === 'modal') {
      modalMedia = { img: dataUrl };
      renderModalMedia();
      const ta = modalRoot.querySelector('[data-composer-input]');
      if (ta) updateComposer(ta);
    } else {
      state.draftMedia = { img: dataUrl };
      state.draftPoll = null;
      renderComposerExtras();
      const ta = $('[data-composer-input]', view);
      if (ta) updateComposer(ta);
    }
    toast('Image ajoutée', 'success');
  } catch (err) {
    toast('Impossible de lire cette image', 'error');
  }
});

function renderModalMedia() {
  const slot = modalRoot.querySelector('.media-preview-slot');
  if (!slot) return;
  if (modalMedia) {
    const inner = modalMedia.img
      ? `<img src="${modalMedia.img}" alt="Aperçu">`
      : `<span>${modalMedia.emoji}</span>`;
    slot.innerHTML = `
      <div class="media-preview" style="${modalMedia.img ? '' : `background:${modalMedia.bg}`}">
        ${inner}
        <button class="remove-media" data-action="remove-media">${IC.close}</button>
      </div>`;
  } else {
    slot.innerHTML = '';
  }
}

/* ============================================================
   PANNEAU ÉMOJI
   ============================================================ */
function toggleEmojiPanel(composer) {
  const existing = composer.querySelector('.emoji-panel');
  if (existing) {
    existing.remove();
    if (composer.closest('#view')) state.emojiOpen = false;
    return;
  }
  const panel = document.createElement('div');
  panel.className = 'emoji-panel';
  panel.innerHTML = `<div class="emoji-grid">${EMOJIS.map(e => `<button class="emoji-btn" data-emoji="${e}">${e}</button>`).join('')}</div>`;
  composer.querySelector('.composer-body').appendChild(panel);
  if (composer.closest('#view')) state.emojiOpen = true;
}
function insertEmoji(emojiBtn) {
  const composer = emojiBtn.closest('.composer');
  const ta = composer.querySelector('[data-composer-input]');
  if (!ta) return;
  const emoji = emojiBtn.dataset.emoji;
  const pos = ta.selectionStart ?? ta.value.length;
  ta.value = ta.value.slice(0, pos) + emoji + ta.value.slice(ta.selectionEnd ?? pos);
  ta.focus();
  ta.setSelectionRange(pos + emoji.length, pos + emoji.length);
  updateComposer(ta);
  if (!composer.dataset.replyTo && !composer.dataset.quoteOf && !composer.dataset.editId) {
    state.draft = ta.value;
  }
}

/* ============================================================
   INTERACTIONS (clics)
   ============================================================ */
document.addEventListener('click', (e) => {
  // Hashtags & mentions cliquables
  const tagEl = e.target.closest('[data-tag]');
  if (tagEl) {
    state.search = tagEl.dataset.tag;
    state.view = 'explore';
    render();
    window.scrollTo(0, 0);
    return;
  }
  const mentionEl = e.target.closest('[data-mention]');
  if (mentionEl) {
    const u = userByHandle(mentionEl.dataset.mention);
    if (u) openProfile(u.handle);
    else toast('Ce profil est introuvable');
    return;
  }
  // Émoji du panneau
  const emojiBtn = e.target.closest('.emoji-btn');
  if (emojiBtn) { insertEmoji(emojiBtn); return; }

  const btn = e.target.closest('[data-action]');
  if (!btn) {
    closeMenu();
    return;
  }
  const action = btn.dataset.action;

  if (action === 'nav') {
    const v = btn.dataset.view;
    if (v === 'profile') state.profileUser = ME.handle;
    if (state.view === v && v !== 'home') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    state.view = v;
    modalRoot.innerHTML = '';
    closeMenu();
    render();
    window.scrollTo(0, 0);
    return;
  }

  if (action === 'tab') {
    state.tab = btn.dataset.tab;
    render();
    return;
  }

  if (action === 'notif-tab') {
    state.notifTab = btn.dataset.tab;
    render();
    return;
  }

  if (action === 'profile-tab') {
    state.profileTab = btn.dataset.tab;
    render();
    return;
  }

  if (action === 'open-profile') {
    e.stopPropagation();
    openProfile(btn.dataset.handle);
    return;
  }

  if (action === 'open-theme') {
    openThemeModal();
    return;
  }

  if (action === 'set-theme') {
    state.theme = btn.dataset.theme;
    document.documentElement.dataset.theme = state.theme;
    saveState();
    openThemeModal();
    toast('Thème mis à jour', 'success');
    return;
  }

  if (action === 'toast') {
    toast(btn.dataset.msg || 'Bientôt disponible');
    return;
  }

  if (action === 'trend') {
    state.search = btn.dataset.q;
    state.view = 'explore';
    render();
    window.scrollTo(0, 0);
    return;
  }

  if (action === 'clear-search') {
    const inp = $('#globalSearch');
    if (inp) { inp.value = ''; inp.focus(); }
    return;
  }

  if (action === 'focus-composer') {
    if (state.view !== 'home') { state.view = 'home'; render(); }
    const ta = $('[data-composer-input]', view);
    if (ta) { ta.focus(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    return;
  }

  if (action === 'scroll-top') {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  if (action === 'follow') {
    e.stopPropagation();
    const h = btn.dataset.handle;
    setFollow(h, !state.followed.has(h));
    render(true);
    return;
  }

  if (action === 'add-media') {
    mediaTarget = btn.closest('.modal') ? 'modal' : 'main';
    $('#fileInput').click();
    return;
  }

  if (action === 'remove-media') {
    if (btn.closest('.modal')) {
      modalMedia = null;
      renderModalMedia();
      const ta = modalRoot.querySelector('[data-composer-input]');
      if (ta) updateComposer(ta);
    } else {
      state.draftMedia = null;
      renderComposerExtras();
      const ta = $('[data-composer-input]', view);
      if (ta) updateComposer(ta);
    }
    return;
  }

  if (action === 'add-poll') {
    if (state.draftMedia) { toast('Un seul média par publication', 'error'); return; }
    state.draftPoll = state.draftPoll ? null : { options: ['', ''] };
    renderComposerExtras();
    const ta = $('[data-composer-input]', view);
    if (ta) updateComposer(ta);
    return;
  }

  if (action === 'add-poll-option') {
    if (state.draftPoll && state.draftPoll.options.length < 4) {
      state.draftPoll.options.push('');
      renderComposerExtras();
    }
    return;
  }

  if (action === 'remove-poll') {
    state.draftPoll = null;
    renderComposerExtras();
    const ta = $('[data-composer-input]', view);
    if (ta) updateComposer(ta);
    return;
  }

  if (action === 'toggle-emoji') {
    toggleEmojiPanel(btn.closest('.composer'));
    return;
  }

  if (action === 'post') {
    const composer = btn.closest('.composer');
    const ta = composer.querySelector('[data-composer-input]');
    const text = ta.value.trim();
    const inModal = !!composer.closest('.modal');
    const media = inModal ? modalMedia : state.draftMedia;
    const poll = inModal ? null : state.draftPoll;

    // Édition d'une publication existante
    if (composer.dataset.editId) {
      const t = state.tweets.find(x => x.id === composer.dataset.editId);
      if (!text) return;
      if (t) { t.text = text; t.edited = true; saveState(); }
      modalRoot.innerHTML = '';
      toast('Publication modifiée', 'success');
      render(true);
      return;
    }

    const hasContent = text.length > 0 || media || poll;
    if (!hasContent || text.length > 280) return;

    if (composer.dataset.replyTo) {
      const parent = state.tweets.find(t => t.id === composer.dataset.replyTo);
      publishTweet(text, { parentId: composer.dataset.replyTo, media });
      if (parent) parent.replies++;
      modalRoot.innerHTML = '';
      toast('Votre réponse a été envoyée', 'success');
      render(true);
      return;
    }

    if (composer.dataset.quoteOf) {
      publishTweet(text, { quoteOf: composer.dataset.quoteOf, media });
      modalRoot.innerHTML = '';
      toast('Votre publication a été envoyée', 'success');
      render();
      window.scrollTo(0, 0);
      return;
    }

    publishTweet(text, { media, poll });
    state.draft = '';
    state.draftMedia = null;
    state.draftPoll = null;
    state.emojiOpen = false;
    toast('Votre publication a été envoyée', 'success');
    render();
    window.scrollTo(0, 0);
    return;
  }

  if (action === 'vote-poll') {
    const tid = btn.dataset.tweet;
    const opt = parseInt(btn.dataset.option);
    const t = state.tweets.find(x => x.id === tid);
    if (t && t.poll && state.votedPolls[tid] === undefined) {
      t.poll.options[opt].votes++;
      state.votedPolls[tid] = opt;
      saveState();
      render(true);
      toast('Vote enregistré');
    }
    return;
  }

  if (action === 'show-new-posts') {
    state.tweets = [...state.pending, ...state.tweets];
    state.pending = [];
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  if (action === 'open-chat') {
    state.activeChat = btn.dataset.id;
    state.convos[state.activeChat].unread = false;
    state.view = 'chat';
    render();
    window.scrollTo(0, 0);
    return;
  }

  if (action === 'send-message') {
    const input = $('#chatInput');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    const convo = state.convos[state.activeChat];
    convo.messages.push({ from: 'me', text, ts: Date.now() });
    input.value = '';
    input.style.height = 'auto';
    // Indicateur « écrit… » puis réponse simulée
    state.typingIn = convo.id;
    render();
    setTimeout(() => {
      const replies = ['Intéressant 🤔', 'Je vois !', 'D\'accord avec toi 👍', 'Merci pour l\'info', 'Oh cool !', 'Ah bon ?', 'On en parle demain ?'];
      convo.messages.push({ from: convo.user.handle, text: replies[Math.floor(Math.random() * replies.length)], ts: Date.now() });
      state.typingIn = null;
      if (state.view === 'chat' && state.activeChat === convo.id) render();
      else { convo.unread = true; updateBadges(); }
    }, 1200 + Math.random() * 1500);
    return;
  }

  if (action === 'read-notif') {
    const n = state.notifications.find(x => x.id === btn.dataset.id);
    if (n) {
      n.unread = false;
      render(true);
    }
    return;
  }

  if (action === 'mark-all-read') {
    state.notifications.forEach(n => n.unread = false);
    render(true);
    toast('Tout a été marqué comme lu');
    return;
  }

  if (action === 'edit-profile') {
    openEditProfileModal();
    return;
  }

  if (action === 'save-profile') {
    const modal = btn.closest('.modal');
    const name = modal.querySelector('[name="name"]').value.trim();
    const bio = modal.querySelector('[name="bio"]').value.trim();
    const location = modal.querySelector('[name="location"]').value.trim();
    const link = modal.querySelector('[name="link"]').value.trim();
    if (!name) { toast('Le nom ne peut pas être vide', 'error'); return; }
    ME.name = name;
    ME.bio = bio;
    ME.location = location;
    ME.link = link;
    saveState();
    modalRoot.innerHTML = '';
    initMe();
    render();
    toast('Profil mis à jour', 'success');
    return;
  }

  if (action === 'tweet-menu') {
    e.stopPropagation();
    const id = btn.dataset.id;
    const t = state.tweets.find(x => x.id === id);
    if (t) openTweetMenu(btn, t);
    return;
  }

  if (action === 'retweet-menu') {
    e.stopPropagation();
    const t = state.tweets.find(x => x.id === btn.dataset.id);
    if (t) openRetweetMenu(btn, t);
    return;
  }

  if (action === 'do-retweet') {
    e.stopPropagation();
    closeMenu();
    const t = state.tweets.find(x => x.id === btn.dataset.id);
    if (!t) return;
    t.retweeted = !t.retweeted;
    t.retweets += t.retweeted ? 1 : -1;
    if (t.retweeted) toast('Republication ajoutée à votre profil', 'success');
    else toast('Republication annulée');
    saveState();
    render(true);
    return;
  }

  if (action === 'quote') {
    e.stopPropagation();
    closeMenu();
    const t = state.tweets.find(x => x.id === btn.dataset.id);
    if (t) openQuoteModal(t);
    return;
  }

  if (action === 'close-menu') {
    closeMenu();
    return;
  }

  if (action === 'close-modal') {
    modalRoot.innerHTML = '';
    return;
  }

  if (action === 'open-quote') {
    e.stopPropagation();
    openTweetDetail(btn.dataset.id);
    return;
  }

  if (action === 'open-media') {
    e.stopPropagation();
    const src = btn.src || (btn.closest('.tweet-media, .detail-media') || {}).querySelector?.('img')?.src;
    if (src) openLightbox(src);
    return;
  }

  if (action === 'close-lightbox') {
    lightboxRoot.innerHTML = '';
    return;
  }

  if (action === 'confirm-ok') {
    modalRoot.innerHTML = '';
    if (window._confirmCb) { window._confirmCb(); window._confirmCb = null; }
    return;
  }

  if (action === 'open-tweet') {
    const id = btn.dataset.id;
    if (!id) return;
    // Double-clic = J'aime ; clic simple = ouvrir le détail (petit délai de détection)
    if (tweetClick._timer && tweetClick._id === id) {
      clearTimeout(tweetClick._timer);
      tweetClick._timer = null; tweetClick._id = null;
      const tdbl = state.tweets.find(x => x.id === id);
      if (tdbl && !tdbl.liked) { tdbl.liked = true; tdbl.likes++; saveState(); render(true); }
      floatingHeart(e.clientX || 100, e.clientY || 100);
      return;
    }
    tweetClick._id = id;
    tweetClick._timer = setTimeout(() => {
      tweetClick._timer = null; tweetClick._id = null;
      openTweetDetail(id);
    }, 240);
    return;
  }

  // === Actions liées à un tweet ===
  const id = btn.dataset.id;
  if (!id) return;
  const t = state.tweets.find(x => x.id === id);
  if (!t) return;

  if (action === 'like') {
    e.stopPropagation();
    t.liked = !t.liked;
    t.likes += t.liked ? 1 : -1;
    if (t.liked) floatingHeartFromBtn(btn);
    saveState();
    if (state.view === 'tweet') render(true);
    else {
      btn.classList.toggle('active', t.liked);
      btn.querySelector('.count').textContent = fmt(t.likes);
    }
    return;
  }
  if (action === 'bookmark') {
    e.stopPropagation();
    t.bookmarked = !t.bookmarked;
    toast(t.bookmarked ? 'Ajouté à vos signets' : 'Retiré de vos signets');
    saveState();
    if (state.view === 'bookmarks') render(true);
    else if (state.view === 'tweet') render(true);
    else btn.classList.toggle('active', t.bookmarked);
    return;
  }
  if (action === 'share') {
    e.stopPropagation();
    toast('Lien copié dans le presse-papiers', 'success');
    if (navigator.clipboard) navigator.clipboard.writeText(location.href.split('#')[0] + '#tweet-' + t.id).catch(() => {});
    return;
  }
  if (action === 'delete') {
    e.stopPropagation();
    closeMenu();
    openConfirm({
      title: 'Supprimer la publication ?',
      text: 'Cette action est définitive. La publication sera supprimée de votre profil et des fils d\'actualité.',
      confirmLabel: 'Supprimer',
      onConfirm: () => {
        const wasPinned = state.pinnedId === t.id;
        state.tweets = state.tweets.filter(x => x.id !== id && x.parentId !== id);
        if (wasPinned) state.pinnedId = null;
        if (state.activeTweet === id) { state.view = 'home'; }
        saveState();
        toast('Publication supprimée');
        render(true);
      }
    });
    return;
  }
  if (action === 'edit-tweet') {
    e.stopPropagation();
    closeMenu();
    openEditTweetModal(t);
    return;
  }
  if (action === 'pin') {
    e.stopPropagation();
    closeMenu();
    if (state.pinnedId === t.id) {
      state.pinnedId = null;
      toast('Publication retirée de votre profil');
    } else {
      state.pinnedId = t.id;
      toast('Publication épinglée sur votre profil', 'success');
    }
    saveState();
    render(true);
    return;
  }
  if (action === 'hide-tweet') {
    e.stopPropagation();
    closeMenu();
    state.hidden.add(t.id);
    toast('Publication masquée');
    if (state.activeTweet === t.id) state.view = 'home';
    render(true);
    return;
  }
  if (action === 'reply') {
    e.stopPropagation();
    openReplyModal(t);
    return;
  }
});

/* --- Saisie --- */
document.addEventListener('input', (e) => {
  const ta = e.target;
  if (ta.matches('[data-composer-input]')) {
    updateComposer(ta);
    const composer = ta.closest('.composer');
    if (composer && !composer.dataset.replyTo && !composer.dataset.quoteOf && !composer.dataset.editId) {
      state.draft = ta.value;
    }
    return;
  }
  if (ta.id === 'exploreSearch') {
    state.search = ta.value;
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => render(), 220);
    return;
  }
  if (ta.id === 'globalSearch') {
    clearTimeout(window._globalTimer);
    window._globalTimer = setTimeout(() => {
      const q = ta.value.trim();
      if (q) {
        state.search = q;
        state.view = 'explore';
        render();
        const el = $('#exploreSearch');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      }
    }, 400);
    return;
  }
  if (ta.id === 'chatInput') {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
    const btn = $('#sendBtn');
    if (btn) btn.disabled = ta.value.trim().length === 0;
    return;
  }
  if (ta.hasAttribute('data-poll-option')) {
    const i = parseInt(ta.dataset.pollOption);
    if (state.draftPoll && state.draftPoll.options[i] !== undefined) {
      state.draftPoll.options[i] = ta.value;
      const span = ta.parentElement.querySelector('.char');
      if (span) span.textContent = 25 - ta.value.length;
      const mainTa = $('[data-composer-input]', view);
      if (mainTa) updateComposer(mainTa);
    }
    return;
  }
  if (ta.name === 'bio' || ta.name === 'name') {
    const max = ta.name === 'name' ? 50 : 160;
    const charEl = ta.parentElement.querySelector('.form-char');
    if (charEl) charEl.textContent = (max - ta.value.length);
  }
});

/* --- Clavier --- */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (lightboxRoot.innerHTML) { lightboxRoot.innerHTML = ''; return; }
    if (modalRoot.innerHTML) { modalRoot.innerHTML = ''; return; }
    closeMenu();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    const ta = document.activeElement;
    if (ta && ta.matches('[data-composer-input]')) {
      const composer = ta.closest('.composer');
      const btn = composer.querySelector('.post-btn');
      if (!btn.disabled) btn.click();
    }
    if (ta && ta.id === 'chatInput') {
      const btn = $('#sendBtn');
      if (!btn.disabled) btn.click();
    }
    return;
  }
  // Entrée = envoyer dans le chat
  if (e.key === 'Enter' && !e.shiftKey && document.activeElement && document.activeElement.id === 'chatInput') {
    e.preventDefault();
    const btn = $('#sendBtn');
    if (!btn.disabled) btn.click();
    return;
  }
  // Raccourcis clavier (hors champs de saisie)
  const ae = document.activeElement;
  if (ae && /INPUT|TEXTAREA/.test(ae.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const shortcuts = {
    'h': 'home', 'e': 'explore', 'n': 'notifications',
    'm': 'messages', 'b': 'bookmarks', 'p': 'profile'
  };
  if (shortcuts[e.key.toLowerCase()]) {
    state.view = shortcuts[e.key.toLowerCase()];
    if (state.view === 'profile') state.profileUser = ME.handle;
    render();
    window.scrollTo(0, 0);
    return;
  }
  if (e.key === '?') {
    openShortcutsModal();
  }
});

function positionMenu(menu, rect) {
  document.body.appendChild(menu);
  const menuRect = menu.getBoundingClientRect();
  let left = rect.right - menuRect.width;
  let top = rect.bottom + 4;
  if (top + menuRect.height > window.innerHeight) top = rect.top - menuRect.height - 4;
  if (left < 8) left = 8;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
}

function addRandomNotification(author) {
  const kinds = [
    { type: 'like', text: 'a aimé votre publication' },
    { type: 'rt', text: 'a republié votre publication' },
    { type: 'follow', text: 'a commencé à vous suivre' }
  ];
  const k = kinds[Math.floor(Math.random() * kinds.length)];
  state.notifications.unshift({
    id: 'n' + Date.now(), type: k.type, unread: true,
    user: author, text: k.text, ts: Date.now()
  });
  updateBadges();
}

function scheduleLiveTweet() {
  const delay = 35000 + Math.random() * 35000;
  setTimeout(() => {
    if (poolIndex < EXTRA_POOL.length && state.pending.length < 5) {
      const item = EXTRA_POOL[poolIndex++];
      const author = USERS[item.a];
      state.pending.push({
        id: 'live' + Date.now(),
        author,
        ts: Date.now(),
        text: item.text,
        likes: Math.floor(Math.random() * 40),
        retweets: Math.floor(Math.random() * 12),
        replies: 0,
        views: Math.floor(200 + Math.random() * 3000),
        liked: false, retweeted: false, bookmarked: false,
        following: state.followed.has(author.handle),
        media: item.media
      });
      if (Math.random() < .45) addRandomNotification(author);
      if (state.view === 'home') render(true);
      else updateBadges();
    }
    scheduleLiveTweet();
  }, delay);
}

  $('#scrollTopBtn').classList.toggle('visible', window.scrollY > 600);
}, { passive: true });

   INIT
   ============================================================ */
function initMe() {
  const a = $('#meAvatar');
  a.style.width = a.style.height = '40px';
  a.style.fontSize = '17px';
  a.style.background = ME.color;
  a.textContent = ME.name[0].toUpperCase();
  $('#meName').innerHTML = `${esc(ME.name)} ${VERIFIED_SM}`;
  $('#meHandle').textContent = '@' + ME.handle;
}
document.documentElement.dataset.theme = state.theme;
initMe();
render();
renderTrends();
renderSuggestions();
scheduleLiveTweet();

setTimeout(() => toast('Bienvenue sur X Clone Pro ! Appuyez sur ? pour les raccourcis ✨', 'success'), 500);
