<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X — Clone Pro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e7e9ea' d='M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z'/%3E%3C/svg%3E">
<style>
/* ============ RESET & VARIABLES ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #000000;
  --bg-elev: #16181c;
  --bg-elev-2: #202327;
  --bg-hover: rgba(255,255,255,.03);
  --bg-hover-strong: rgba(255,255,255,.06);
  --text: #e7e9ea;
  --text-dim: #71767b;
  --border: #2f3336;
  --blue: #1d9bf0;
  --blue-hover: #1a8cd8;
  --green: #00ba7c;
  --pink: #f91880;
  --purple: #7856ff;
  --yellow: #ffd400;
  --orange: #ff7a00;
  --radius: 16px;
  --sidebar-w: 275px;
  --right-w: 350px;
  --main-w: 600px;
}
[data-theme="light"] {
  --bg: #ffffff;
  --bg-elev: #f7f9f9;
  --bg-elev-2: #eff3f4;
  --bg-hover: rgba(0,0,0,.03);
  --bg-hover-strong: rgba(0,0,0,.06);
  --text: #0f1419;
  --text-dim: #536471;
  --border: #eff3f4;
}
[data-theme="dim"] {
  --bg: #15202b;
  --bg-elev: #1e2732;
  --bg-elev-2: #273340;
  --bg-hover: rgba(255,255,255,.03);
  --bg-hover-strong: rgba(255,255,255,.06);
  --text: #f7f9f9;
  --text-dim: #8b98a5;
  --border: #38444d;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow-y: scroll;
  transition: background .3s, color .3s;
}
button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; outline: none; resize: none; }
svg { display: block; flex-shrink: 0; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* ============ LAYOUT ============ */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) var(--main-w) var(--right-w);
  justify-content: center;
  gap: 0;
  max-width: 1400px;
  margin: 0 auto;
  min-height: 100vh;
}

/* ============ SIDEBAR ============ */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0 8px;
  gap: 2px;
}
.logo {
  width: 50px; height: 50px;
  display: grid; place-items: center;
  border-radius: 50%;
  margin: 4px 0 2px 2px;
  transition: background .2s;
  align-self: flex-start;
}
.logo:hover { background: var(--bg-hover-strong); }
.logo svg { width: 28px; height: 28px; fill: var(--text); }
.nav-item {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 11px 13px;
  border-radius: 999px;
  font-size: 19px;
  transition: background .18s;
  align-self: flex-start;
  max-width: 100%;
  position: relative;
}
.nav-item:hover { background: var(--bg-hover-strong); }
.nav-item svg { width: 26px; height: 26px; stroke: var(--text); stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.nav-item.active svg { stroke-width: 2.6; }
.nav-item.active { font-weight: 700; }
.nav-item .badge {
  background: var(--blue); color: #fff;
  font-size: 11px; font-weight: 700;
  min-width: 20px; height: 20px;
  border-radius: 999px;
  display: grid; place-items: center;
  padding: 0 5px;
  margin-left: -8px;
}
.side-post {
  background: var(--blue);
  color: #fff;
  font-weight: 700;
  font-size: 17px;
  border-radius: 999px;
  padding: 15px 0;
  width: 90%;
  margin: 16px 0 8px;
  transition: background .2s, transform .1s;
}
.side-post:hover { background: var(--blue-hover); }
.side-post:active { transform: scale(.97); }
.me {
  margin-top: auto;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 999px;
  transition: background .18s;
  width: 100%;
  text-align: left;
}
.me:hover { background: var(--bg-hover-strong); }
.me-info { flex: 1; min-width: 0; line-height: 1.25; }
.me-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 3px; }
.me-handle { color: var(--text-dim); font-size: 14px; }
.me .dots { color: var(--text-dim); font-size: 18px; letter-spacing: 1px; }

/* ============ AVATARS ============ */
.avatar {
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 700;
  flex-shrink: 0;
  user-select: none;
  line-height: 1;
  letter-spacing: -.02em;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
  position: relative;
}
.avatar.online::after {
  content: '';
  position: absolute;
  bottom: 2px; right: 2px;
  width: 10px; height: 10px;
  background: var(--green);
  border: 2px solid var(--bg);
  border-radius: 50%;
}
.verified {
  width: 18px; height: 18px;
  color: var(--blue);
  flex-shrink: 0;
}
.verified.sm { width: 15px; height: 15px; }
.verified.gold { color: var(--yellow); }

/* ============ MAIN ============ */
.main {
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  min-height: 100vh;
  min-width: 0;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 0 16px;
  height: 53px;
}
.topbar h1 {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.02em;
}
.topbar-actions {
  margin-left: auto;
  display: flex;
  gap: 4px;
}
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  transition: background .18s;
  color: var(--text);
}
.icon-btn:hover { background: var(--bg-hover-strong); }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.back-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  transition: background .18s;
  margin-left: -8px;
}
.back-btn:hover { background: var(--bg-hover-strong); }
.back-btn svg { width: 20px; height: 20px; stroke: var(--text); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tabs { display: flex; }
.tab {
  flex: 1;
  padding: 16px 0;
  font-size: 15px;
  font-weight: 500;
  color: var(--text-dim);
  position: relative;
  transition: background .18s;
}
.tab:hover { background: var(--bg-hover); }
.tab.active { color: var(--text); font-weight: 700; }
.tab.active::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 56px; height: 4px;
  background: var(--blue);
  border-radius: 999px;
}

/* ============ COMPOSER ============ */
.composer {
  display: flex;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  align-items: flex-start;
}
.composer-body { flex: 1; min-width: 0; padding-top: 4px; }
.composer textarea {
  width: 100%;
  font-size: 20px;
  line-height: 1.4;
  min-height: 52px;
  max-height: 320px;
  padding: 8px 0;
  overflow-y: auto;
}
.composer textarea::placeholder { color: var(--text-dim); }
.audience-selector {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--blue);
  font-weight: 700;
  font-size: 14px;
  padding: 4px 12px;
  border-radius: 999px;
  margin-bottom: 6px;
  transition: background .18s;
}
.audience-selector:hover { background: rgba(29,155,240,.12); }
.audience-selector svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.4; fill: none; }
.reply-restriction {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--blue);
  font-weight: 700;
  font-size: 14px;
  padding: 6px 0;
  margin-top: 4px;
  border-top: 1px solid var(--border);
  width: 100%;
  padding-top: 12px;
}
.reply-restriction svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.4; fill: none; }
.reply-restriction:hover { text-decoration: underline; cursor: pointer; }
.composer-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.tool-icons { display: flex; align-items: center; gap: 2px; margin-left: -8px; }
.tool {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--blue);
  transition: background .18s;
  position: relative;
}
.tool:hover { background: rgba(29,155,240,.12); }
.tool:disabled { opacity: .4; cursor: not-allowed; }
.tool svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.composer-submit { display: flex; align-items: center; gap: 12px; }
.ring-wrap { position: relative; width: 26px; height: 26px; display: grid; place-items: center; }
.ring { width: 26px; height: 26px; transform: rotate(-90deg); }
.ring circle { transition: stroke-dashoffset .15s linear, stroke .2s; }
.char-count {
  position: absolute;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
}
.char-count.danger { color: var(--pink); }
.post-btn {
  background: var(--blue);
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  padding: 9px 20px;
  border-radius: 999px;
  transition: background .2s, opacity .2s, transform .1s;
}
.post-btn:hover:not(:disabled) { background: var(--blue-hover); }
.post-btn:active:not(:disabled) { transform: scale(.96); }
.post-btn:disabled { opacity: .5; cursor: default; }

/* Image preview in composer */
.media-preview {
  margin-top: 12px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  position: relative;
  max-height: 300px;
  display: grid;
  place-items: center;
  font-size: 48px;
  font-weight: 800;
  min-height: 180px;
}
.media-preview img {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  display: block;
}
.media-preview .remove-media {
  position: absolute;
  top: 8px; right: 8px;
  background: rgba(0,0,0,.75);
  color: #fff;
  width: 30px; height: 30px;
  border-radius: 50%;
  display: grid; place-items: center;
  transition: background .18s;
}
.media-preview .remove-media:hover { background: rgba(0,0,0,.9); }
.media-preview .remove-media svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2.4; fill: none; }

/* Poll in composer */
.poll-builder {
  margin-top: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
}
.poll-option-input {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 8px;
  transition: border-color .2s;
}
.poll-option-input:focus-within { border-color: var(--blue); }
.poll-option-input input { flex: 1; font-size: 15px; }
.poll-option-input .char { font-size: 12px; color: var(--text-dim); }
.poll-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
}
.poll-remove {
  color: var(--pink);
  font-size: 14px;
  font-weight: 600;
}
.poll-remove:hover { text-decoration: underline; }

/* ============ TWEET ============ */
.tweet {
  display: flex;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  transition: background .15s;
  cursor: pointer;
  position: relative;
}
.tweet:hover { background: var(--bg-hover); }
.tweet-pinned {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 700;
  padding-bottom: 4px;
  margin-left: 28px;
}
.tweet-pinned svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.tweet-body { flex: 1; min-width: 0; }
.tweet-head {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 15px;
  min-width: 0;
}
.tweet-head .name {
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 160px;
  cursor: pointer;
}
.tweet-head .name:hover { text-decoration: underline; }
.tweet-head .handle, .tweet-head .time {
  color: var(--text-dim);
  white-space: nowrap;
}
.tweet-head .handle { overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.tweet-more {
  margin-left: auto;
  width: 34px; height: 34px;
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--text-dim);
  opacity: 0;
  transition: opacity .15s, background .15s, color .15s;
  margin-top: -6px; margin-right: -8px;
}
.tweet:hover .tweet-more { opacity: 1; }
.tweet-more:hover { background: rgba(29,155,240,.12); color: var(--blue); }
.tweet-more svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tweet-text {
  font-size: 15px;
  line-height: 1.45;
  margin-top: 2px;
  overflow-wrap: anywhere;
}
.tweet-text .link, .detail-text .link, .profile-bio .link { color: var(--blue); cursor: pointer; }
.tweet-text .link:hover, .detail-text .link:hover, .profile-bio .link:hover { text-decoration: underline; }
.tweet-media {
  margin-top: 12px;
  border-radius: var(--radius);
  height: 240px;
  border: 1px solid var(--border);
  overflow: hidden;
  display: grid;
  place-items: center;
  font-size: 42px;
  font-weight: 800;
  color: rgba(255,255,255,.85);
  letter-spacing: -.03em;
}
.tweet-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  cursor: zoom-in;
  display: block;
}

/* Poll in tweet */
.poll {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.poll-option {
  position: relative;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: background .18s, border-color .18s;
  overflow: hidden;
}
.poll-option:hover:not(.voted) { background: var(--bg-hover-strong); border-color: var(--blue); }
.poll-option.voted { cursor: default; }
.poll-option .fill {
  position: absolute;
  inset: 0;
  background: var(--blue);
  opacity: .18;
  width: 0;
  transition: width .6s ease;
}
.poll-option.winner .fill { background: var(--blue); opacity: .3; }
.poll-option-content {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  font-weight: 500;
}
.poll-option.voted .poll-option-content { font-weight: 400; }
.poll-option.my-choice .poll-option-content { font-weight: 700; }
.poll-option .percent { font-weight: 700; color: var(--text); }
.poll-meta { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

.tweet-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 425px;
  margin-top: 10px;
  margin-left: -8px;
}
.action {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--text-dim);
  font-size: 13px;
  padding: 4px 7px;
  border-radius: 999px;
  transition: color .18s, background .18s;
}
.action svg {
  width: 18px; height: 18px;
  stroke: currentColor; stroke-width: 1.9;
  fill: none; stroke-linecap: round; stroke-linejoin: round;
}
.action .count { min-width: 12px; text-align: left; }
.action.reply:hover { color: var(--blue); background: rgba(29,155,240,.12); }
.action.retweet:hover { color: var(--green); background: rgba(0,186,124,.12); }
.action.like:hover  { color: var(--pink); background: rgba(249,24,128,.12); }
.action.bookmark:hover { color: var(--blue); background: rgba(29,155,240,.12); }
.action.share:hover { color: var(--blue); background: rgba(29,155,240,.12); }
.action.views:hover { color: var(--blue); background: rgba(29,155,240,.12); }
.action.retweet.active { color: var(--green); }
.action.like.active { color: var(--pink); }
.action.like.active svg { fill: var(--pink); stroke: var(--pink); }
.action.bookmark.active { color: var(--blue); }
.action.bookmark.active svg { fill: var(--blue); stroke: var(--blue); }
.action.retweet.active svg { stroke-width: 2.4; }
@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.35); }
  100% { transform: scale(1); }
}
.action.like.active svg, .action-lg.like.active svg { animation: pop .35s ease; }

/* Hearts floating animation */
@keyframes floatHeart {
  0% { opacity: 1; transform: translate(0, 0) scale(.5); }
  100% { opacity: 0; transform: translate(var(--tx, 0), -60px) scale(1.2); }
}
.heart-float {
  position: fixed;
  pointer-events: none;
  color: var(--pink);
  animation: floatHeart .9s ease-out forwards;
  z-index: 320;
}

/* ============ RIGHT SIDEBAR ============ */
.rightbar {
  padding: 8px 0 0 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-elev);
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 11px 16px;
  transition: border-color .2s, background .2s;
  position: relative;
}
.search-box:focus-within { border-color: var(--blue); background: var(--bg); }
.search-box svg { width: 18px; height: 18px; stroke: var(--text-dim); stroke-width: 2; fill: none; stroke-linecap: round; }
.search-box:focus-within svg { stroke: var(--blue); }
.search-box input { flex: 1; font-size: 15px; }
.search-box input::placeholder { color: var(--text-dim); }
.search-box .clear-search {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--blue);
  color: #fff;
  display: none;
  place-items: center;
}
.search-box:has(input:not(:placeholder-shown)) .clear-search { display: grid; }
.search-box .clear-search svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 2.6; }

.card {
  background: var(--bg-elev);
  border-radius: var(--radius);
  overflow: hidden;
}
.card-title {
  font-size: 19px;
  font-weight: 800;
  padding: 12px 16px;
  letter-spacing: -.02em;
}
.premium-card {
  padding: 16px;
}
.premium-card h3 {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 6px;
}
.premium-card p {
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 12px;
}
.premium-btn {
  background: var(--text);
  color: var(--bg);
  font-weight: 700;
  font-size: 14px;
  padding: 8px 18px;
  border-radius: 999px;
  transition: opacity .2s;
}
.premium-btn:hover { opacity: .9; }

.trend {
  padding: 11px 16px;
  display: block;
  width: 100%;
  text-align: left;
  transition: background .15s;
  position: relative;
}
.trend:hover { background: var(--bg-hover-strong); }
.trend-meta { font-size: 13px; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; }
.trend-dot {
  color: var(--text-dim);
  font-size: 16px;
  width: 28px; height: 28px;
  border-radius: 50%;
  display: grid; place-items: center;
  transition: background .15s, color .15s;
}
.trend-dot:hover { background: rgba(29,155,240,.12); color: var(--blue); }
.trend-name { font-weight: 700; font-size: 15px; margin-top: 1px; }
.trend-count { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

.follow-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  transition: background .15s;
}
.follow-row:hover { background: var(--bg-hover-strong); }
.follow-info { flex: 1; min-width: 0; line-height: 1.25; }
.follow-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 3px; }
.follow-name:hover { text-decoration: underline; cursor: pointer; }
.follow-handle { color: var(--text-dim); font-size: 14px; }
.follow-btn {
  background: var(--text);
  color: var(--bg);
  font-weight: 700;
  font-size: 14px;
  padding: 7px 16px;
  border-radius: 999px;
  transition: opacity .2s, background .2s, color .2s;
  flex-shrink: 0;
  min-width: 80px;
}
.follow-btn:hover { opacity: .85; }
.follow-btn.following {
  background: transparent;
  color: var(--text);
  box-shadow: inset 0 0 0 1px var(--border);
}
.follow-btn.following:hover {
  background: rgba(249,24,128,.12);
  color: var(--pink);
  box-shadow: inset 0 0 0 1px rgba(249,24,128,.4);
}
.follow-btn.following:hover::before { content: 'Se désabonner'; }
.follow-btn.following:hover .label { display: none; }
.show-more {
  padding: 14px 16px;
  color: var(--blue);
  font-size: 15px;
  width: 100%;
  text-align: left;
  transition: background .15s;
}
.show-more:hover { background: var(--bg-hover-strong); }
.footer-links {
  font-size: 13px;
  color: var(--text-dim);
  padding: 0 16px 40px;
  line-height: 1.7;
}
.footer-links span { margin-right: 10px; cursor: pointer; }
.footer-links span:hover { text-decoration: underline; }

/* ============ VIEWS ============ */
.empty {
  padding: 60px 32px;
  text-align: center;
  color: var(--text-dim);
}
.empty-icon {
  width: 56px; height: 56px;
  margin: 0 auto 16px;
  stroke: var(--text-dim);
  stroke-width: 1.5;
  fill: none;
}
.empty h3 { color: var(--text); font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.empty p { font-size: 15px; max-width: 380px; margin: 0 auto 20px; line-height: 1.5; }
.empty-btn {
  background: var(--blue);
  color: #fff;
  font-weight: 700;
  padding: 10px 22px;
  border-radius: 999px;
  font-size: 15px;
  transition: background .2s;
}
.empty-btn:hover { background: var(--blue-hover); }

/* Notifications */
.notif {
  display: flex;
  gap: 14px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  transition: background .15s;
  cursor: pointer;
  position: relative;
}
.notif:hover { background: var(--bg-hover); }
.notif.unread::before {
  content: '';
  position: absolute;
  top: 20px; left: 6px;
  width: 7px; height: 7px;
  background: var(--blue);
  border-radius: 50%;
}
.notif-icon { width: 30px; flex-shrink: 0; display: grid; place-items: start center; padding-top: 3px; }
.notif-icon svg { width: 26px; height: 26px; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.notif-icon.like { color: var(--pink); }
.notif-icon.like svg { fill: var(--pink); stroke: var(--pink); }
.notif-icon.rt { color: var(--green); }
.notif-icon.rt svg { stroke: var(--green); }
.notif-icon.follow { color: var(--blue); }
.notif-icon.follow svg { stroke: var(--blue); }
.notif-icon.mention { color: var(--purple); }
.notif-icon.mention svg { stroke: var(--purple); }
.notif-body { flex: 1; font-size: 15px; line-height: 1.45; }
.notif-body b { font-weight: 700; }
.notif-time { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

/* Messages */
.convo {
  display: flex;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  transition: background .15s;
  cursor: pointer;
  align-items: flex-start;
  position: relative;
}
.convo:hover { background: var(--bg-hover); }
.convo.active { background: var(--bg-hover-strong); border-left: 2px solid var(--blue); }
.convo-body { flex: 1; min-width: 0; }
.convo-top { display: flex; gap: 5px; align-items: center; font-size: 15px; }
.convo-top .name { font-weight: 700; }
.convo-top .handle, .convo-top .time { color: var(--text-dim); }
.convo-top .time { margin-left: auto; }
.convo-preview { color: var(--text-dim); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.convo-unread-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--blue);
  margin-left: 8px;
  flex-shrink: 0;
  align-self: center;
}

/* Profile */
.profile-banner {
  height: 200px;
  background: linear-gradient(135deg, #1d9bf0, #7856ff 55%, #f91880);
  position: relative;
}
.profile-head { padding: 0 16px 16px; position: relative; }
.profile-avatar-wrap {
  margin-top: -68px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 12px;
}
.profile-avatar-wrap .avatar { border: 4px solid var(--bg); }
.profile-edit {
  border: 1px solid var(--border);
  font-weight: 700;
  font-size: 15px;
  padding: 8px 18px;
  border-radius: 999px;
  transition: background .18s, color .18s, border-color .18s;
}
.profile-edit:hover { background: var(--bg-hover-strong); }
.profile-edit.follow-state {
  background: var(--text);
  color: var(--bg);
  border-color: transparent;
  min-width: 100px;
}
.profile-edit.follow-state:hover { opacity: .85; }
.profile-edit.follow-state.is-following {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}
.profile-edit.follow-state.is-following:hover {
  background: rgba(249,24,128,.12);
  color: var(--pink);
  border-color: rgba(249,24,128,.4);
}
.profile-name { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
.profile-handle { color: var(--text-dim); font-size: 15px; margin-top: 2px; }
.profile-bio { margin-top: 12px; font-size: 15px; line-height: 1.45; }
.profile-meta { display: flex; gap: 18px; margin-top: 12px; color: var(--text-dim); font-size: 14px; flex-wrap: wrap; }
.profile-meta span { display: flex; align-items: center; gap: 5px; }
.profile-meta svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.profile-stats { display: flex; gap: 20px; margin-top: 12px; font-size: 14px; color: var(--text-dim); }
.profile-stats b { color: var(--text); font-weight: 700; }
.profile-stats span { cursor: pointer; }
.profile-stats span:hover b { text-decoration: underline; }
.profile-tabs {
  display: flex;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

/* Chat view */
.chat-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px);
  z-index: 10;
}
.chat-header-info { flex: 1; min-width: 0; }
.chat-header-name { font-weight: 800; display: flex; align-items: center; gap: 4px; }
.chat-messages {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: calc(100vh - 180px);
}
.msg {
  max-width: 70%;
  padding: 10px 14px;
  border-radius: 20px;
  font-size: 15px;
  line-height: 1.4;
  word-wrap: break-word;
  position: relative;
  animation: msgIn .25s ease-out;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg.received {
  background: var(--bg-elev-2);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.msg.sent {
  background: var(--blue);
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.msg-time {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
  text-align: center;
}
.chat-input-wrap {
  position: sticky;
  bottom: 0;
  padding: 10px 16px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  gap: 10px;
}
.chat-input {
  flex: 1;
  background: var(--bg-elev);
  border-radius: 20px;
  padding: 10px 14px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.chat-input textarea {
  flex: 1;
  max-height: 120px;
  font-size: 15px;
  line-height: 1.4;
}
.send-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: transparent;
  color: var(--blue);
  display: grid; place-items: center;
  transition: background .2s, opacity .2s;
}
.send-btn:hover { background: rgba(29,155,240,.12); }
.send-btn:disabled { opacity: .4; cursor: default; }
.send-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ============ MODAL ============ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(91,112,131,.4);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 16px 20px;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(14px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
.modal {
  background: var(--bg);
  border-radius: var(--radius);
  width: 100%;
  max-width: 600px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 0 24px rgba(0,0,0,.4);
  animation: slideUp .2s ease;
}
.modal.small { max-width: 400px; }
.modal-head {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 10px 16px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 2;
}
.modal-head h2 { font-size: 20px; font-weight: 800; }
.modal-close {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid; place-items: center;
  transition: background .18s;
}
.modal-close:hover { background: var(--bg-hover-strong); }
.modal-close svg { width: 20px; height: 20px; stroke: var(--text); stroke-width: 2.2; fill: none; stroke-linecap: round; }
.modal .composer { border-bottom: 1px solid var(--border); }
.modal .composer textarea { font-size: 18px; min-height: 90px; }
.reply-context {
  display: flex;
  gap: 12px;
  padding: 8px 16px 4px;
}
.reply-context .ctx-body { flex: 1; min-width: 0; padding-bottom: 12px; }
.reply-line {
  width: 2px;
  background: var(--border);
  flex: 1;
  margin: 4px auto 0;
  border-radius: 2px;
  min-height: 12px;
}

/* Context menu (tweet options) */
.menu {
  position: fixed;
  background: var(--bg);
  border-radius: var(--radius);
  box-shadow: 0 0 15px rgba(136,153,166,.15), 0 1px 4px rgba(136,153,166,.2);
  padding: 4px 0;
  min-width: 220px;
  z-index: 150;
  animation: slideUp .15s ease;
  border: 1px solid var(--border);
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 700;
  width: 100%;
  text-align: left;
  transition: background .15s;
}
.menu-item:hover { background: var(--bg-hover-strong); }
.menu-item svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.menu-item.danger { color: var(--pink); }

/* Edit profile modal */
.edit-form { padding: 0 16px 16px; }
.form-group {
  margin-bottom: 20px;
  position: relative;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 10px;
  transition: border-color .2s;
}
.form-group:focus-within { border-color: var(--blue); }
.form-group label {
  display: block;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 2px;
}
.form-group:focus-within label { color: var(--blue); }
.form-group input, .form-group textarea {
  width: 100%;
  font-size: 15px;
  padding: 2px 0;
}
.form-group textarea { min-height: 60px; }
.form-char {
  position: absolute;
  top: 10px; right: 10px;
  font-size: 13px;
  color: var(--text-dim);
}
.save-btn {
  background: var(--text);
  color: var(--bg);
  font-weight: 700;
  padding: 7px 16px;
  border-radius: 999px;
  font-size: 14px;
  transition: opacity .2s;
}
.save-btn:hover { opacity: .9; }

/* Theme picker */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 16px;
}
.theme-option {
  padding: 16px 10px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  transition: border-color .2s;
  cursor: pointer;
}
.theme-option.selected { border-color: var(--blue); }
.theme-swatch {
  width: 40px; height: 40px;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px var(--border);
}
.theme-option span { font-size: 13px; font-weight: 700; }

/* ============ MOBILE NAV ============ */
.mobile-nav { display: none; }
.mobile-fab {
  display: none;
  position: fixed;
  bottom: 76px;
  right: 16px;
  width: 56px; height: 56px;
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  box-shadow: 0 4px 16px rgba(29,155,240,.4);
  place-items: center;
  z-index: 48;
  transition: transform .2s;
}
.mobile-fab:active { transform: scale(.92); }
.mobile-fab svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; }

/* ============ TOAST ============ */
#toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translate(-50%, 20px);
  background: var(--blue);
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  padding: 11px 22px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .25s;
  z-index: 300;
  box-shadow: 0 4px 20px rgba(29,155,240,.4);
  max-width: 90vw;
  text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.success { background: var(--green); box-shadow: 0 4px 20px rgba(0,186,124,.4); }
#toast.error { background: var(--pink); box-shadow: 0 4px 20px rgba(249,24,128,.4); }

/* Loading skeleton */
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
.skeleton {
  background: linear-gradient(90deg, var(--bg-elev) 0%, var(--bg-elev-2) 50%, var(--bg-elev) 100%);
  background-size: 800px 100%;
  animation: shimmer 1.4s linear infinite;
  border-radius: 4px;
}

/* ============ RESPONSIVE ============ */
@media (max-width: 1280px) {
  .app { grid-template-columns: 88px var(--main-w) var(--right-w); }
  .nav-item span, .me-info, .me .dots, .side-post span { display: none; }
  .nav-item { padding: 12px; }
  .side-post {
    width: 50px; height: 50px;
    padding: 0;
    display: grid; place-items: center;
    margin: 16px 0 8px;
  }
  .side-post::after {
    content: '';
    width: 24px; height: 24px;
    background: #fff;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round'><path d='M12 5v14M5 12h14'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round'><path d='M12 5v14M5 12h14'/></svg>") center/contain no-repeat;
  }
  .logo { align-self: center; }
  .nav-item { align-self: center; }
  .me { padding: 8px; justify-content: center; }
}
@media (max-width: 1000px) {
  .app { grid-template-columns: 88px minmax(0, 1fr); max-width: 700px; }
  .rightbar { display: none; }
}
@media (max-width: 700px) {
  .app { grid-template-columns: minmax(0, 1fr); max-width: 100%; }
  .sidebar { display: none; }
  .main { border: none; padding-bottom: 62px; }
  .tweet-head .name { max-width: 110px; }
  .mobile-nav {
    display: flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    z-index: 50;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .mobile-nav button {
    flex: 1;
    padding: 13px 0;
    display: grid;
    place-items: center;
    position: relative;
  }
  .mobile-nav svg {
    width: 25px; height: 25px;
    stroke: var(--text-dim); stroke-width: 1.9;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .mobile-nav button.active svg { stroke: var(--text); stroke-width: 2.5; }
  .mobile-nav .badge {
    position: absolute;
    top: 7px; left: 50%; margin-left: 4px;
    background: var(--blue); color: #fff;
    font-size: 10px; font-weight: 700;
    min-width: 17px; height: 17px;
    border-radius: 999px;
    display: grid; place-items: center;
    padding: 0 4px;
  }
  .mobile-fab { display: grid; }
  .modal-backdrop { padding: 0; align-items: flex-end; }
  .modal { max-height: 92vh; border-radius: 16px 16px 0 0; max-width: 100%; }
  .modal.small { max-width: 100%; }
  #toast { bottom: 150px; }
  .theme-grid { grid-template-columns: repeat(2, 1fr); }
  .profile-banner { height: 140px; }
}
@media (max-width: 400px) {
  .tweet-head .name { max-width: 80px; }
}

/* ============================================================
   NOUVEAUTÉS v3
   ============================================================ */

/* New posts pill */
.new-posts-pill {
  position: sticky;
  top: 62px;
  z-index: 18;
  display: flex;
  justify-content: center;
  padding-top: 8px;
  pointer-events: none;
}
.new-posts-pill button {
  pointer-events: auto;
  background: var(--blue);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 8px 18px;
  border-radius: 999px;
  box-shadow: 0 4px 14px rgba(29,155,240,.45);
  display: flex;
  align-items: center;
  gap: 7px;
  animation: slideDown .25s ease;
  transition: background .2s;
}
.new-posts-pill button:hover { background: var(--blue-hover); }
.new-posts-pill svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

/* Quote box */
.quote-box {
  margin-top: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  transition: background .15s;
  cursor: pointer;
}
.quote-box:hover { background: var(--bg-hover); }
.quote-head { display: flex; align-items: center; gap: 5px; font-size: 14px; min-width: 0; }
.quote-head .name { font-weight: 700; white-space: nowrap; }
.quote-head .name:hover { text-decoration: underline; }
.quote-head .handle, .quote-head .time { color: var(--text-dim); white-space: nowrap; }
.quote-text {
  font-size: 14px;
  margin-top: 4px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.quote-media {
  margin-top: 8px;
  border-radius: 12px;
  height: 110px;
  overflow: hidden;
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  font-size: 30px;
  font-weight: 800;
  color: rgba(255,255,255,.85);
}
.quote-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.quote-unavailable { color: var(--text-dim); font-size: 14px; padding: 4px 0; }

/* Emoji panel */
.emoji-panel {
  border-top: 1px solid var(--border);
  margin-top: 10px;
  padding-top: 8px;
  animation: fadeIn .15s ease;
}
.emoji-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
  gap: 2px;
  max-height: 150px;
  overflow-y: auto;
}
.emoji-btn {
  font-size: 20px;
  padding: 5px 0;
  border-radius: 8px;
  transition: background .12s, transform .12s;
}
.emoji-btn:hover { background: var(--bg-hover-strong); transform: scale(1.15); }

/* Tweet detail view */
.tweet-detail { padding: 12px 16px 0; border-bottom: 1px solid var(--border); }
.detail-head { display: flex; align-items: center; gap: 10px; }
.detail-head-info { flex: 1; min-width: 0; line-height: 1.3; }
.detail-head-info .name { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.detail-head-info .name:hover { text-decoration: underline; }

.detail-media {

  color: var(--text-dim);

}

.detail-actions {
  display: flex;
  justify-content: space-around;
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  max-width: 425px;
}
.action-lg {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--text-dim);
  transition: background .18s, color .18s;
  position: relative;
}
.action-lg svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.action-lg.reply:hover { color: var(--blue); background: rgba(29,155,240,.12); }
.action-lg.retweet:hover { color: var(--green); background: rgba(0,186,124,.12); }
.action-lg.like:hover { color: var(--pink); background: rgba(249,24,128,.12); }
.action-lg.bookmark:hover, .action-lg.share:hover { color: var(--blue); background: rgba(29,155,240,.12); }
.action-lg.retweet.active { color: var(--green); }
.action-lg.like.active { color: var(--pink); }
.action-lg.like.active svg { fill: var(--pink); stroke: var(--pink); }
.action-lg.bookmark.active { color: var(--blue); }
.action-lg.bookmark.active svg { fill: var(--blue); stroke: var(--blue); }

.inline-reply {
  display: flex;
  gap: 12px;
  padding: 12px 16px;

.inline-reply input {
  flex: 1;
  font-size: 15px;
  padding: 10px 0;
  cursor: pointer;
}
.inline-reply input::placeholder { color: var(--text-dim); }

.section-title {
  font-size: 13px;
  font-weight: 800;
  padding: 14px 16px 2px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .05em;
}

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  z-index: 250;
  display: grid;
  place-items: center;
  padding: 24px;
  cursor: zoom-out;
  animation: fadeIn .15s ease;
}
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.lightbox-close {
  position: absolute;
  top: 16px; right: 16px;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(0,0,0,.55);
  color: #fff;
  display: grid; place-items: center;
  transition: background .18s;
}
.lightbox-close:hover { background: rgba(0,0,0,.8); }
.lightbox-close svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.2; fill: none; stroke-linecap: round; }

/* Typing indicator */
.typing-bubble {
  display: flex;
  gap: 5px;
  align-items: center;
  background: var(--bg-elev-2);
  padding: 14px 18px;
  border-radius: 20px;
  border-bottom-left-radius: 4px;
  align-self: flex-start;
  animation: msgIn .25s ease-out;
}
.typing-bubble span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: typingDot 1.2s infinite;
}
.typing-bubble span:nth-child(2) { animation-delay: .2s; }
.typing-bubble span:nth-child(3) { animation-delay: .4s; }
@keyframes typingDot {
  0%, 60%, 100% { opacity: .3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}

/* Scroll to top */
#scrollTopBtn {
  position: fixed;
  bottom: 84px;
  left: 16px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--blue);
  display: none;
  place-items: center;
  box-shadow: 0 4px 14px rgba(29,155,240,.4);
  z-index: 45;
  transition: transform .2s;
}
#scrollTopBtn.visible { display: grid; }
#scrollTopBtn:hover { background: var(--blue-hover); }
#scrollTopBtn:active { transform: scale(.92); }
#scrollTopBtn svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* Edited tag */
.edited-tag { color: var(--text-dim); font-size: 13px; font-weight: 400; }

/* Shortcuts modal */
.shortcuts-list { padding: 4px 16px 20px; }
.shortcut-row {
  display: flex;

kbd {

  font-size: 13px;
  font-weight: 700;
  min-width: 30px;
  text-align: center;
  display: inline-block;

/* Confirm modal */

.confirm-cancel { background: transparent; box-shadow: inset 0 0 0 1px var(--border); color: var(--text); }

function mediaHTML(m) {
  if (m.img) return `<div class="tweet-media"><img src="${m.img}" alt="Image" loading="lazy" data-action="open-media"></div>`;
  return `<div class="tweet-media" style="background:${m.bg}">${m.emoji}</div>`;
}

function quoteBoxHTML(q) {
  return `
  <div class="quote-box" data-action="open-quote" data-id="${q.id}">
    <div class="quote-head">
      ${avatar(q.author, 20)}
      <span class="name">${esc(q.author.name)}</span>
      ${q.author.verified ? VERIFIED_SM : ''}
      <span class="handle">@${esc(q.author.handle)}</span>
      <span>·</span>
      <span class="time">${timeAgo(q.ts)}</span>
    </div>
    <div class="quote-text">${richText(q.text)}</div>
    ${q.media ? `<div class="quote-media" style="${q.media.img ? '' : `background:${q.media.bg}`}">${q.media.img ? `<img src="${q.media.img}" loading="lazy">` : q.media.emoji}</div>` : ''}
  </div>`;
}

function quoteUnavailable() {
  return `<div class="quote-box"><div class="quote-unavailable">Cette publication n'est plus disponible</div></div>`;
}

        </button>

      ${t.poll ? pollHTML(t) : ''}
      ${t.quoteOf ? (quote ? quoteBoxHTML(quote) : quoteUnavailable()) : ''}
      <div class="tweet-actions">
        <button class="action reply" data-action="reply" data-id="${t.id}" aria-label="Répondre">
          ${IC.reply}<span class="count">${fmt(t.replies)}</span>
        </button>
        <button class="action retweet ${t.retweeted ? 'active' : ''}" data-action="retweet-menu" data-id="${t.id}" aria-label="Republier">
          ${IC.retweet}<span class="count">${fmt(t.retweets)}</span>
        </button>
        <button class="action like ${t.liked ? 'active' : ''}" data-action="like" data-id="${t.id}" aria-label="J'aime">
          ${IC.like}<span class="count">${fmt(t.likes)}</span>
        </button>
        <button class="action views" data-action="toast" data-msg="Statistiques détaillées bientôt" aria-label="Vues">
          ${IC.views}<span class="count">${fmt(t.views || 0)}</span>
        </button>
        <button class="action bookmark ${t.bookmarked ? 'active' : ''}" data-action="bookmark" data-id="${t.id}" aria-label="Enregistrer">
          ${IC.bookmark}
        </button>
        <button class="action share" data-action="share" data-id="${t.id}" aria-label="Partager">
          ${IC.share}
        </button>
      </div>
    </div>
  </article>`;
}

function pollHTML(t) {
  const poll = t.poll;
  const voted = state.votedPolls[t.id] !== undefined;
  const total = poll.options.reduce((s, o) => s + o.votes, 0);
  const maxVotes = Math.max(...poll.options.map(o => o.votes));
  const remaining = Math.max(0, poll.endsAt - Date.now());
  const timeLeft = remaining > 0
    ? Math.floor(remaining / (60*60*1000)) + ' h restantes'
    : 'Terminé';

  return `
  <div class="poll">
    ${poll.options.map((opt, i) => {
      const pct = total > 0 ? Math.round(opt.votes / total * 100) : 0;
      const isWinner = voted && opt.votes === maxVotes;
      const isMy = state.votedPolls[t.id] === i;
      return `
      <div class="poll-option ${voted ? 'voted' : ''} ${isWinner ? 'winner' : ''} ${isMy ? 'my-choice' : ''}"
           ${!voted ? `data-action="vote-poll" data-tweet="${t.id}" data-option="${i}"` : ''}>
        <div class="fill" style="width:${voted ? pct : 0}%"></div>
        <div class="poll-option-content">
          <span>${esc(opt.text)}${isMy ? ' ✓' : ''}</span>
          ${voted ? `<span class="percent">${pct}%</span>` : ''}
        </div>
      </div>
      `;
    }).join('')}
    <div class="poll-meta">${total.toLocaleString('fr-FR')} votes · ${timeLeft}</div>
  </div>`;
}

function renderHeader() {
  if (state.view === 'home') {
    return `

      <div class="topbar-inner">
        <h1>Accueil</h1>
        <div class="topbar-actions">

        </div>
      </div>

        <button class="tab ${state.tab === 'foryou' ? 'active' : ''}" data-action="tab" data-tab="foryou">Pour vous</button>
        <button class="tab ${state.tab === 'following' ? 'active' : ''}" data-action="tab" data-tab="following">Abonnements</button>
      </div>
    </div>`;
  }
  if (state.view === 'profile' || state.view === 'chat' || state.view === 'tweet') return '';

  const titles = {
    explore: 'Explorer', notifications: 'Notifications',
    messages: 'Messages', bookmarks: 'Signets'
  };
  const extras = {
    notifications: `<button class="icon-btn" data-action="mark-all-read" title="Tout marquer comme lu">${IC.settings}</button>`,
    messages: `<button class="icon-btn" data-action="toast" data-msg="Nouveau message bientôt disponible" title="Nouveau message">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>`,
  };

  return `
  <div class="topbar">
    <div class="topbar-inner">
      <button class="back-btn" data-action="nav" data-view="home">${IC.back}</button>
      <h1>${titles[state.view] || ''}</h1>
      <div class="topbar-actions">
        ${extras[state.view] || ''}
      </div>
    </div>
    ${state.view === 'notifications' ? `
    <div class="tabs">
      <button class="tab ${state.notifTab === 'all' ? 'active' : ''}" data-action="notif-tab" data-tab="all">Toutes</button>
      <button class="tab ${state.notifTab === 'mentions' ? 'active' : ''}" data-action="notif-tab" data-tab="mentions">Mentions</button>
    </div>` : ''}
  </div>`;
}

function renderHome() {
  let list = state.tweets.filter(t => !t.parentId && !state.hidden.has(t.id));
  list.sort((a, b) => b.ts - a.ts);
  if (state.tab === 'following') list = list.filter(t => t.following || t.author.handle === ME.handle);
  const pill = state.pending.length ? `
    <div class="new-posts-pill">
      <button data-action="show-new-posts">${IC.arrowUp} Voir ${state.pending.length} nouvelle${state.pending.length > 1 ? 's' : ''} publication${state.pending.length > 1 ? 's' : ''}</button>
    </div>` : '';
  return `
    ${renderHeader()}
    ${composerHTML({ value: state.draft })}
    <div id="feed">
      ${pill}
      ${list.length ? list.map(t => tweetHTML(t)).join('') : emptyState(state.tab === 'following' ? 'home-following' : 'home')}
    </div>`;
}

function renderExplore() {
  const q = state.search.trim().toLowerCase();
  const results = q
    ? state.tweets.filter(t =>
        !t.parentId && !state.hidden.has(t.id) && (
        t.text.toLowerCase().includes(q) ||
        t.author.name.toLowerCase().includes(q) ||
        t.author.handle.toLowerCase().includes(q)))
    : [];
  const matchedUsers = q
    ? Object.values(USERS).filter(u =>
        u.handle !== ME.handle &&
        (u.name.toLowerCase().includes(q) || u.handle.toLowerCase().includes(q)))
    : [];
  return `
  ${renderHeader()}
  <div style="padding:12px 16px;border-bottom:1px solid var(--border)">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="M20 20l-4.6-4.6"/></svg>
      <input type="text" id="exploreSearch" placeholder="Rechercher sur X" value="${esc(state.search)}" autocomplete="off">
    </div>
  </div>
  ${q ? `
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text-dim);font-size:14px">
      ${results.length + matchedUsers.length} résultat${results.length + matchedUsers.length > 1 ? 's' : ''} pour « ${esc(state.search)} »
    </div>
    ${matchedUsers.length ? `
      <div class="section-title">Personnes</div>
      ${matchedUsers.map(u => followRowHTML(u)).join('')}
      <div style="border-bottom:1px solid var(--border)"></div>` : ''}
    ${results.length ? `
      <div class="section-title">Publications</div>
      ${results.map(t => tweetHTML(t)).join('')}` : ''}
    ${!results.length && !matchedUsers.length ? emptyState('search') : ''}
  ` : `
    <div style="padding:16px;border-bottom:1px solid var(--border)">
      <h2 style="font-size:19px;font-weight:800;margin-bottom:12px">Tendances pour vous</h2>
      ${TRENDS.map(t => `
        <button class="trend" data-action="trend" data-q="${esc(t.q)}" style="padding:11px 0">
          <div class="trend-meta"><span>${esc(t.meta)}</span></div>
          <div class="trend-name">${esc(t.q)}</div>
          <div class="trend-count">${esc(t.count)}</div>
        </button>
      `).join('')}
    </div>
  `}
  `;
}

function renderNotifications() {
  const iconFor = (type) => {
    if (type === 'like')    return `<div class="notif-icon like">${IC.like}</div>`;
    if (type === 'rt')      return `<div class="notif-icon rt">${IC.retweet}</div>`;
    if (type === 'follow')  return `<div class="notif-icon follow"><svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.6"/><path d="M3.5 20v-1a5 5 0 015-5h3a5 5 0 015 5v1"/><path d="M19 7v6M22 10h-6"/></svg></div>`;
    return `<div class="notif-icon mention">${IC.reply}</div>`;
  };
  let list = state.notifications;
  if (state.notifTab === 'mentions') list = list.filter(n => n.type === 'mention');
  return `
  ${renderHeader()}
  ${list.length === 0 ? emptyState(state.notifTab === 'mentions' ? 'no-mentions' : 'notifications') : list.map(n => `
    <div class="notif ${n.unread ? 'unread' : ''}" data-action="read-notif" data-id="${n.id}">
      ${iconFor(n.type)}
      <div>${avatar(n.user, 34)}</div>
      <div class="notif-body">
        <div><b>${esc(n.user.name)}</b> ${esc(n.text)}</div>
        ${n.extra ? `<div style="color:var(--text-dim);margin-top:3px">${esc(n.extra)}</div>` : ''}
        <div class="notif-time">${timeAgo(n.ts)}</div>
      </div>
    </div>`).join('')}
  `;
}

function renderMessages() {
  const list = Object.values(state.convos).sort((a, b) => {
    const aT = a.messages[a.messages.length - 1].ts;
    const bT = b.messages[b.messages.length - 1].ts;
    return bT - aT;
  });
  return `
  ${renderHeader()}
  ${list.map(c => {
    const lastMsg = c.messages[c.messages.length - 1];
    const preview = lastMsg.from === 'me' ? `Vous : ${lastMsg.text}` : lastMsg.text;
    return `
    <div class="convo ${state.activeChat === c.id ? 'active' : ''}" data-action="open-chat" data-id="${c.id}">
      ${avatar(c.user, 48, true)}
      <div class="convo-body">
        <div class="convo-top">
          <span class="name">${esc(c.user.name)}</span>
          ${c.user.verified ? VERIFIED_SM : ''}
          <span class="handle">@${esc(c.user.handle)}</span>
          <span class="time">${timeAgo(lastMsg.ts)}</span>
        </div>
        <div class="convo-preview" style="${c.unread ? 'color:var(--text);font-weight:600' : ''}">${esc(preview)}</div>
      </div>
      ${c.unread ? '<div class="convo-unread-dot"></div>' : ''}
    </div>`;
  }).join('')}
  `;
}

      <span class="label">${isFollowing ? 'Abonné' : 'Suivre'}</span>

function renderProfile() {
  const handle = state.profileUser || ME.handle;
  const user = userByHandle(handle) || ME;
  const mine = handle === ME.handle;
  const userTweets = state.tweets
    .filter(t => t.author.handle === handle && !t.parentId && !state.hidden.has(t.id))
    .sort((a, b) => b.ts - a.ts);
  const userReplies = state.tweets
    .filter(t => t.author.handle === handle && t.parentId)
    .sort((a, b) => b.ts - a.ts);
  const userMedia = userTweets.filter(t => t.media);
  const liked = mine ? state.tweets.filter(t => t.liked) : [];

  let pinned = null, list = userTweets;
  if (mine && state.pinnedId) {
    pinned = list.find(t => t.id === state.pinnedId);
    if (pinned) list = list.filter(t => t.id !== pinned.id);
  }

  let content;
  switch (state.profileTab) {
    case 'replies':
      content = userReplies.length ? userReplies.map(t => tweetHTML(t)).join('') : emptyState('profile-replies'); break;
    case 'media':
      content = userMedia.length ? userMedia.map(t => tweetHTML(t)).join('') : emptyState('profile-media'); break;
    case 'likes':
      content = mine
        ? (liked.length ? liked.map(t => tweetHTML(t)).join('') : emptyState('profile-likes'))
        : emptyState('profile-likes-private'); break;
    default:
      content = (pinned ? tweetHTML(pinned, { pinned: true }) : '') +
        (list.length ? list.map(t => tweetHTML(t)).join('') : (pinned ? '' : emptyState('profile-tweets')));
  }

  const isFollowing = state.followed.has(handle);
  const bannerBg = mine ? '' : `style="background:${user.color}"`;
  return `
  <div class="topbar">
    <div class="topbar-inner">
      <button class="back-btn" data-action="nav" data-view="home">${IC.back}</button>
      <div>
        <div style="font-size:19px;font-weight:800;letter-spacing:-.02em">${esc(user.name)}</div>
        <div style="font-size:13px;color:var(--text-dim)">${userTweets.length + userReplies.length} publications</div>
      </div>
    </div>
  </div>
  <div class="profile-banner" ${bannerBg}></div>
  <div class="profile-head">
    <div class="profile-avatar-wrap">
      <div style="border-radius:50%;border:4px solid var(--bg);width:fit-content">${avatar(user, 132)}</div>
      ${mine
        ? `<button class="profile-edit" data-action="edit-profile">Modifier le profil</button>`
        : `<button class="profile-edit follow-state ${isFollowing ? 'is-following' : ''}" data-action="follow" data-handle="${esc(handle)}">${isFollowing ? 'Abonné' : 'Suivre'}</button>`}
    </div>
    <div class="profile-name">${esc(user.name)} ${user.verified ? VERIFIED : ''}</div>
    <div class="profile-handle">@${esc(user.handle)}</div>
    ${user.bio ? `<div class="profile-bio">${richText(user.bio)}</div>` : ''}
    <div class="profile-meta">
      ${user.location ? `<span>${IC.location}${esc(user.location)}</span>` : ''}
      ${user.link ? `<span>${IC.link}<span class="link" style="color:var(--blue)">${esc(user.link)}</span></span>` : ''}
      ${user.joined ? `<span>${IC.calendar}${esc(user.joined)}</span>` : ''}
    </div>
    <div class="profile-stats">
      <span data-action="toast" data-msg="Liste des abonnements bientôt"><b>${(user.following ?? 0).toLocaleString('fr-FR')}</b> abonnements</span>
      <span data-action="toast" data-msg="Liste des abonnés bientôt"><b>${(user.followers ?? 0).toLocaleString('fr-FR')}</b> abonnés</span>
    </div>
  </div>
  <div class="profile-tabs tabs">
    <button class="tab ${state.profileTab === 'tweets' ? 'active' : ''}" data-action="profile-tab" data-tab="tweets">Publications</button>
    <button class="tab ${state.profileTab === 'replies' ? 'active' : ''}" data-action="profile-tab" data-tab="replies">Réponses</button>
    <button class="tab ${state.profileTab === 'media' ? 'active' : ''}" data-action="profile-tab" data-tab="media">Médias</button>
    <button class="tab ${state.profileTab === 'likes' ? 'active' : ''}" data-action="profile-tab" data-tab="likes">J'aime</button>
  </div>
  <div>${content}</div>`;
}

/* ============================================================
   RENDU PRINCIPAL
   ============================================================ */
function render(preserveScroll = false) {
  const scroll = window.scrollY;
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && active.selectionStart;

  switch (state.view) {
    case 'home':          view.innerHTML = renderHome(); break;
    case 'explore':       view.innerHTML = renderExplore(); break;
    case 'notifications': view.innerHTML = renderNotifications(); break;
    case 'messages':      view.innerHTML = renderMessages(); break;
    case 'chat':          view.innerHTML = renderChat(); break;
    case 'bookmarks':     view.innerHTML = renderBookmarks(); break;
    case 'profile':       view.innerHTML = renderProfile(); break;
    case 'tweet':         view.innerHTML = renderTweetDetail(); break;
  }
  $$('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.view === state.view);
  });
  $$('.mobile-nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === state.view);
  });

  // Composer state
  const ta = $('[data-composer-input]', view);
  if (ta && state.view === 'home') {
    renderComposerExtras();
    updateComposer(ta);
  }

  // Chat auto-scroll
  if (state.view === 'chat') {
    const chat = $('#chatMessages');
    if (chat) chat.scrollTop = chat.scrollHeight;
  }

  // Restore focus
  if (activeId === 'exploreSearch') {
    const el = $('#exploreSearch');
    if (el) { el.focus(); el.setSelectionRange(selStart, selStart); }
  }
  if (activeId === 'globalSearch') {
    const el = $('#globalSearch');
    if (el) { el.focus(); el.setSelectionRange(selStart, selStart); }
  }
  if (activeId === 'chatInput') {
    const el = $('#chatInput');
    if (el) el.focus();
  }

  updateBadges();
  if (preserveScroll) window.scrollTo(0, scroll);
}

function updateBadges() {
  const unreadNotifs = state.notifications.filter(n => n.unread).length;
  const unreadMsgs = Object.values(state.convos).filter(c => c.unread).length;

  [$('#notifBadge'), $('#notifBadgeM')].forEach(b => {
    if (!b) return;
    b.textContent = unreadNotifs;
    b.style.display = unreadNotifs > 0 ? 'grid' : 'none';
  });
  [$('#msgBadge'), $('#msgBadgeM')].forEach(b => {
    if (!b) return;
    b.textContent = unreadMsgs;
    b.style.display = unreadMsgs > 0 ? 'grid' : 'none';
  });
}

function renderComposerExtras() {

  if (previewSlot) {
    if (state.draftMedia) {
      const inner = state.draftMedia.img

        : `<span>${state.draftMedia.emoji}</span>`;
      previewSlot.innerHTML = `
        <div class="media-preview" style="${state.draftMedia.img ? '' : `background:${state.draftMedia.bg}`}">
          ${inner}

        </div>`;
    } else {
      previewSlot.innerHTML = '';
    }

  if (pollSlot) {
    if (state.draftPoll) {
      pollSlot.innerHTML = `
      <div class="poll-builder">
        ${state.draftPoll.options.map((opt, i) => `
          <div class="poll-option-input">
            <input type="text" data-poll-option="${i}" placeholder="Choix ${i+1}" value="${esc(opt)}" maxlength="25">
            <span class="char">${25 - opt.length}</span>

function renderSuggestions() {

  if (!box) return;

function renderTrends() {
  const box = $('#trendsList');
  if (!box) return;
  box.innerHTML = TRENDS.slice(0, 4).map(t => `
    <button class="trend" data-action="trend" data-q="${esc(t.q)}">

/* ============================================================
   COMPOSER & PUBLICATION
   ============================================================ */
const CIRC = 2 * Math.PI * 9;
function updateComposer(ta) {
  const composer = ta.closest('.composer');
  if (!composer) return;
  const len = ta.value.length;
  const rem = 280 - len;
  const ring = composer.querySelector('.ring-progress');
  if (ring) {
    ring.style.strokeDashoffset = CIRC * (1 - Math.min(len, 280) / 280);
    ring.style.stroke = rem < 0 ? 'var(--pink)' : rem <= 20 ? 'var(--yellow)' : 'var(--blue)';
  }
  const counter = composer.querySelector('.char-count');
  if (counter) {
    counter.textContent = rem <= 20 ? rem : '';
    counter.classList.toggle('danger', rem < 0);
  }
  const btn = composer.querySelector('.post-btn');
  const media = composer.closest('.modal') ? modalMedia : state.draftMedia;
  const poll = composer.closest('.modal') ? null : state.draftPoll;
  const hasContent = len > 0 || media || poll;
  if (btn) btn.disabled = !hasContent || rem < 0;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 320) + 'px';
}

function publishTweet(text, { parentId, quoteOf, media, poll } = {}) {
  const t = {
    id: 't' + Date.now() + Math.floor(Math.random() * 1000),
    author: ME,
    ts: Date.now(),
    text: text.trim(),
    likes: 0, retweets: 0, replies: 0, views: 1,
    liked: false, retweeted: false, bookmarked: false,
    following: true,
    parentId: parentId || undefined,
    quoteOf: quoteOf || undefined,
    media: media || undefined,
    poll: poll ? {
      endsAt: Date.now() + 24 * 60 * 60 * 1000,
      options: poll.options.filter(o => o.trim()).map(o => ({ text: o, votes: 0 }))
    } : undefined
  };
  if (t.poll && t.poll.options.length < 2) delete t.poll;
  state.tweets.unshift(t);
  saveState();
  return t;
}

function setFollow(handle, follow) {
  const u = userByHandle(handle);
  if (!u || handle === ME.handle) return;
  const was = state.followed.has(handle);
  if (follow === was) return;
  if (follow) {
    state.followed.add(handle);
    ME.following++;
    if (u.followers !== undefined) u.followers++;
    toast('Vous suivez maintenant @' + handle, 'success');
  } else {
    state.followed.delete(handle);
    ME.following--;
    if (u.followers !== undefined) u.followers--;
    toast('Vous ne suivez plus @' + handle);
  }
  state.tweets.forEach(t => { if (t.author.handle === handle) t.following = follow; });
  saveState();
  renderSuggestions();
}

function openProfile(handle) {
  state.profileUser = handle;
  state.profileTab = 'tweets';
  state.view = 'profile';
  modalRoot.innerHTML = '';
  closeMenu();
  render();
  window.scrollTo(0, 0);
}

function openTweetDetail(id) {
  state.activeTweet = id;
  state.view = 'tweet';
  modalRoot.innerHTML = '';
  closeMenu();
  render();
  window.scrollTo(0, 0);
}
