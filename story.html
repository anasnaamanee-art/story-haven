<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Haven – Tales in English, Arabic &amp; French</title>

    <!-- Google Fonts: Poppins for EN/FR body, Playfair Display for headings, Tajawal for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ==================== CSS CUSTOM PROPERTIES (Light Mode Default) ==================== */
        :root {
            --bg-primary: #fefaf6;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-modal-overlay: rgba(30, 20, 10, 0.7);
            --bg-modal: #ffffff;
            --text-primary: #2c2416;
            --text-secondary: #5c4b32;
            --text-muted: #8a7a65;
            --accent: #c8843c;
            --accent-hover: #a66a2e;
            --accent-light: #f5e6d3;
            --border: #e5d9c8;
            --shadow-card: 0 4px 20px rgba(60, 30, 0, 0.08);
            --shadow-card-hover: 0 12px 36px rgba(60, 30, 0, 0.16);
            --shadow-modal: 0 20px 60px rgba(0, 0, 0, 0.3);
            --gradient-hero: linear-gradient(160deg, #fdf3e4 0%, #fefaf6 40%, #faf5ed 100%);
            --btn-lang-bg: #f5ede2;
            --btn-lang-active-bg: #c8843c;
            --btn-lang-active-text: #ffffff;
            --btn-darkmode-bg: #2c2416;
            --btn-darkmode-icon: #f5deb3;
            --card-tag-bg: #fdf3e4;
            --card-tag-text: #b8752e;
            --divider: #e5d9c8;
            --icon-sun: '☀️';
            --icon-moon: '🌙';
            --transition-speed: 0.35s;
        }

        /* ==================== DARK MODE OVERRIDES ==================== */
        body.dark-mode {
            --bg-primary: #1a1612;
            --bg-secondary: #211c16;
            --bg-card: #28231c;
            --bg-modal-overlay: rgba(0, 0, 0, 0.8);
            --bg-modal: #28231c;
            --text-primary: #ede4d8;
            --text-secondary: #c4b8a5;
            --text-muted: #9b8d7a;
            --accent: #e0a456;
            --accent-hover: #f0bc6a;
            --accent-light: #3a2e1f;
            --border: #3d3529;
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.35);
            --shadow-card-hover: 0 12px 36px rgba(0, 0, 0, 0.55);
            --shadow-modal: 0 20px 60px rgba(0, 0, 0, 0.7);
            --gradient-hero: linear-gradient(160deg, #2a2318 0%, #1a1612 40%, #201b14 100%);
            --btn-lang-bg: #3a3024;
            --btn-lang-active-bg: #e0a456;
            --btn-lang-active-text: #1a1612;
            --btn-darkmode-bg: #f5deb3;
            --btn-darkmode-icon: #2c2416;
            --card-tag-bg: #3a2e1f;
            --card-tag-text: #e0a456;
            --divider: #3d3529;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Poppins', 'Tajawal', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
            min-height: 100vh;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        html[dir='rtl'] body {
            font-family: 'Tajawal', 'Poppins', sans-serif;
        }

        .hero {
            background: var(--gradient-hero);
            padding: 3.5rem 2rem 3rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
            transition: background var(--transition-speed) ease, border-color var(--transition-speed) ease;
            position: relative;
        }

        .hero-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 0.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }

        .hero h1 {
            font-family: 'Playfair Display', 'Tajawal', serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .hero .subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 400;
            max-width: 550px;
            margin: 0 auto;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1.25rem 2rem;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            transition: background-color var(--transition-speed) ease, border-color var(--transition-speed) ease;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(6px);
        }

        .controls-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .lang-btn {
            padding: 0.5rem 1.1rem;
            border: 2px solid transparent;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            background-color: var(--btn-lang-bg);
            color: var(--text-primary);
            transition: all 0.25s ease;
            font-family: inherit;
            white-space: nowrap;
        }
        .lang-btn:hover {
            border-color: var(--accent);
            background-color: var(--accent-light);
        }
        .lang-btn.active {
            background-color: var(--btn-lang-active-bg);
            color: var(--btn-lang-active-text);
            border-color: var(--btn-lang-active-bg);
            box-shadow: 0 2px 10px rgba(200, 132, 60, 0.3);
        }

        .darkmode-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            font-size: 1.3rem;
            background-color: var(--btn-darkmode-bg);
            color: var(--btn-darkmode-icon);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            line-height: 1;
        }
        .darkmode-toggle:hover {
            transform: rotate(25deg) scale(1.08);
            border-color: var(--accent);
        }

        .stories-container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.75rem;
        }

        .story-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 1.75rem 1.5rem;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
            overflow: hidden;
        }
        .story-card::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 100px;
            height: 100px;
            background: var(--accent-light);
            border-radius: 50%;
            opacity: 0;
            transition: all 0.5s ease;
            pointer-events: none;
        }
        .story-card:hover {
            box-shadow: var(--shadow-card-hover);
            transform: translateY(-6px);
            border-color: var(--accent);
        }
        .story-card:hover::before {
            opacity: 0.5;
            top: -20px;
            right: -20px;
            width: 130px;
            height: 130px;
        }

        .story-card .card-number {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .story-card .card-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background-color: var(--card-tag-bg);
            color: var(--card-tag-text);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            align-self: flex-start;
        }

        .story-card h3 {
            font-family: 'Playfair Display', 'Tajawal', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .story-card .preview {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .story-card .read-more-indicator {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: gap 0.3s ease;
        }
        .story-card:hover .read-more-indicator { gap: 0.6rem; }
        .read-more-indicator .arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }
        html[dir='rtl'] .read-more-indicator .arrow { transform: rotate(180deg); }
        .story-card:hover .read-more-indicator .arrow { transform: translateX(4px); }
        html[dir='rtl'] .story-card:hover .read-more-indicator .arrow { transform: rotate(180deg) translateX(4px); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: var(--bg-modal-overlay);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background-color: var(--bg-modal);
            border-radius: 1.5rem;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-modal);
            position: relative;
            transform: translateY(30px) scale(0.96);
            transition: transform 0.35s ease;
        }
        .modal-overlay.active .modal { transform: translateY(0) scale(1); }

        .modal-close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            z-index: 5;
            line-height: 1;
        }
        html[dir='rtl'] .modal-close-btn { right: auto; left: 1rem; }
        .modal-close-btn:hover { background: #e74c3c; color: #fff; border-color: #e74c3c; }

        .modal .modal-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background-color: var(--card-tag-bg);
            color: var(--card-tag-text);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            margin-bottom: 0.75rem;
        }

        .modal h2 {
            font-family: 'Playfair Display', 'Tajawal', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .modal .story-full-text {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.85;
            white-space: pre-line;
        }

        .modal .modal-divider { border: none; height: 1px; background: var(--divider); margin: 1.25rem 0; }

        .site-footer { text-align: center; padding: 2rem; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border); }

        ::-webkit-scrollbar { width: 7px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        @media (max-width: 640px) {
            .hero { padding: 2.5rem 1rem 2rem; }
            .hero-icon { font-size: 2.5rem; }
            .controls-bar { gap: 0.5rem; padding: 1rem; }
            .lang-btn { padding: 0.4rem 0.85rem; font-size: 0.78rem; }
            .stories-container { grid-template-columns: 1fr; padding: 1.5rem 1rem 3rem; gap: 1.25rem; }
            .story-card { padding: 1.25rem 1.1rem; }
            .modal { padding: 1.75rem 1.25rem; border-radius: 1.25rem; }
            .modal h2 { font-size: 1.4rem; }
        }

        @media (min-width: 900px) {
            .stories-container { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body class="">

    <header class="hero">
        <span class="hero-icon">📚</span>
        <h1>Story Haven</h1>
        <p class="subtitle" data-i18n="heroSubtitle">Discover enchanting tales — read in English, Arabic, or French</p>
    </header>

    <div class="controls-bar" id="controlsBar">
        <span class="controls-label" data-i18n="langLabel">Language:</span>
        <button class="lang-btn active" data-lang="en" aria-label="Switch to English">🇬🇧 English</button>
        <button class="lang-btn" data-lang="ar" aria-label="Switch to Arabic">🇸🇦 العربية</button>
        <button class="lang-btn" data-lang="fr" aria-label="Switch to French">🇫🇷 Français</button>
        <button class="darkmode-toggle" id="darkmodeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
    </div>

    <main class="stories-container" id="storiesGrid"></main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent" role="dialog" aria-modal="true">
            <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close story">✕</button>
            <span class="modal-tag" data-i18n="storyTag">Story</span>
            <h2 id="modalTitle"></h2>
            <hr class="modal-divider">
            <p class="story-full-text" id="modalBody"></p>
        </div>
    </div>

    <footer class="site-footer">
        <span data-i18n="footerText">✨ Story Haven — Crafted with care · © 2026</span>
    </footer>

    <script>
        (function() {
            // ─────────────────────────────────────
            // EXTENDED STORY DATA — 4 long stories in 3 languages
            // English is the primary language; all stories are now rich and detailed.
            // ─────────────────────────────────────
            const storiesData = {
                en: [
                    {
                        id: 1,
                        tag: 'Wonder',
                        title: 'The Star Collector',
                        preview: 'Luna had always been fascinated by the night sky. Every evening she climbed to the rooftop of her small house and watched the stars twinkle above. One night something extraordinary happened — a star fell right into her backyard. When she picked it up it was warm and pulsed gently with light...',
                        full: 'Luna had always been fascinated by the night sky. From the time she was a little girl she would sneak out of her room, climb the creaky wooden ladder to the roof, and lie on her back counting the stars. The village where she lived was small and quiet, far from the bright lights of any city, so the stars appeared with dazzling clarity. She named them all: the three bright ones above the bakery she called the Baker’s Triplets; the reddish one near the horizon was Old Tom; and the shimmering cluster directly overhead was the Diamond Fountain.\n\nOne night something extraordinary happened. Luna was sitting cross-legged on the roof when she saw a streak of silver light slash across the sky. It grew brighter and brighter until, with a soft thud, something landed in the overgrown garden behind her house. Her heart pounding, she scrambled down the ladder and rushed outside. There, nestled among the daisies, lay a small, glowing sphere no larger than a marble. It was warm, pulsating gently with a golden light, and when she cupped it in her hands, a flood of images filled her mind. She saw a grandmother rolling dough, a little boy laughing, the scent of cinnamon and sugar. It was a memory — a perfectly preserved, beautiful memory of love.\n\nLuna soon discovered that the fallen star was not just a star. It was a keeper of precious moments that people had lost over time. She began searching for other fallen stars. Some were hidden in hollow tree trunks, others floating on the surface of the pond at dawn. Each one contained a memory: a father’s lullaby, a first bicycle ride, a farewell wave from a train platform. Luna became the Star Collector. She would return the memories to those who had forgotten them — an elderly woman who had lost her husband, a musician who had forgotten his first melody, a child who couldn’t remember her mother’s face. Every time Luna returned a star, the sky above her village seemed to sparkle a little brighter. She realized that the universe never truly takes anything away; it only asks someone brave enough to bring it back.'
                    },
                    {
                        id: 2,
                        tag: 'Magic',
                        title: 'The Whispering Garden',
                        preview: 'Behind the old stone wall at the end of the village lay a garden that everyone had forgotten. But young Sami could hear it whispering. The flowers didn\'t just bloom — they spoke in soft rustling voices that only the pure of heart could understand...',
                        full: 'Behind the old stone wall at the end of the village lay a garden that everyone had forgotten. The gate was rusted, the path overgrown with ivy, and the villagers told stories that it was haunted. But young Sami, a boy with curious eyes and an even more curious heart, felt drawn to the wall. Every afternoon after school he would sit with his back against the cool stones and listen. At first he heard nothing. But one spring day, when the wind carried the scent of jasmine, he heard it — a soft, rustling voice that seemed to come from the other side.\n\n“Come closer,” the voice whispered. Sami squeezed through a gap in the wall and found himself in a magical place. The garden was alive. Flowers of every color turned their petals toward him, and vines gently uncurled as if to greet him. A rosebush with crimson blooms spoke in a voice like velvet: “We have waited so long. We are the keepers of promises.” Each flower, Sami learned, was a promise that someone had made and kept. The daisies held the promise of a mother to always protect her child; the tulips remembered a friend’s vow to stay loyal; the lavender carried the fragrance of forgiveness between sisters.\n\nThe garden had been forgotten because people had stopped believing in the power of their own promises. Sami, with his pure heart, became the garden’s new gardener. He tended the flowers and, in return, they whispered forgotten promises back into the world. When a villager passed by the wall, they would suddenly remember a kindness they had promised long ago. Slowly the village changed. People began to keep their word again, and the garden’s whispers became a gentle hum of joy. Sami never told anyone the secret; he just smiled, knowing that some magic only grows when it is kept safe by a listening heart.'
                    },
                    {
                        id: 3,
                        tag: 'Mystery',
                        title: 'The Clockmaker\'s Secret',
                        preview: 'In a narrow alley of the old city lived a clockmaker named Elias. His clocks were unlike any other — they didn\'t just measure time, they gave it back. People who visited his shop would find themselves reliving their happiest moments...',
                        full: 'In a narrow alley of the old city, where the cobblestones were worn smooth by centuries of footsteps, lived a clockmaker named Elias. His shop was a treasure trove of ticking wonders: grandfather clocks that chimed like distant bells, pocket watches with intricate engravings, and tiny cuckoo clocks that sang old folk tunes. But Elias’s clocks held a deeper magic. They didn’t simply measure time; they could return it. A visitor who held a specific clock would suddenly be transported back to a precious moment from their past — a first kiss under a cherry tree, the sound of a newborn’s cry, the comforting smell of a grandfather’s workshop.\n\nElias welcomed everyone with a gentle smile, but no one knew the sorrow he carried. Years ago he had lost his wife, Lila, to a sudden illness. He had tried everything to use one of his own clocks to relive their happiest day together — a picnic by the river where she had laughed and the sunlight had turned her hair into gold. But every clock he built refused to work for him. The magic seemed to slip through his fingers whenever he tried to capture that one memory. So Elias poured his loneliness into creating clocks for others, finding solace in their joy.\n\nOne rainy afternoon, a little girl named Mira pushed open the creaky door. She was holding a broken music box. “Can you fix it?” she asked. Her eyes were the same shade of brown as Lila’s. Elias took the music box and, while repairing it, he began to talk with Mira. She told him about her grandmother who had passed away, and how she wished she could hear her voice again. Without thinking, Elias handed her a small silver pocket watch. “Hold it close,” he said. Mira did, and tears rolled down her cheeks as she heard her grandmother singing the old lullaby. In that moment Elias understood: his clocks could never bring back his own lost time because he had been holding on too tightly. Love, he realized, isn’t about going backward; it’s about passing the gift forward. He built one final clock — not to relive the past, but to measure every new second with hope. The ticking never sounded so sweet.'
                    },
                    {
                        id: 4,
                        tag: 'Hope',
                        title: 'The Ocean\'s Gift',
                        preview: 'Every year on the first day of summer the ocean would offer a single gift to one child in the coastal village of Mirabay. No one knew how the ocean chose but the gift was always exactly what the child needed most...',
                        full: 'Every year on the first day of summer the ocean would offer a single gift to one child in the coastal village of Mirabay. The tradition was as old as the cliffs themselves, and no one knew how the ocean chose. The children would gather on the shore at dawn, their feet sinking into the cool sand, waiting. Some years a polished piece of sea glass appeared; other years a perfect spiral shell. But the gift was never just an object — it was something that mended a broken heart.\n\nThis year the ocean chose Kira. She was a quiet girl who had recently lost her father to the sea. He had been a fisherman, and one stormy night his boat never returned. Kira stopped speaking for weeks. She would sit on the rocks and stare at the waves, feeling as empty as the horizon. When the waves retreated on that special morning, they left behind a small, iridescent shell that shimmered with every color of the sunrise. Kira picked it up hesitantly. It was warm, almost alive.\n\nWhen she held it to her ear she expected to hear the usual ocean roar. Instead she heard her father’s voice — gentle, full of love. He told her about the constellations he used to navigate by, about the dolphins that danced beside his boat, and about how much he loved her. The shell didn’t bring back the past; it gave Kira something more precious: the knowledge that love never truly disappears. She carried the shell everywhere. On difficult days its whisper reminded her that she was not alone. The ocean, she realized, does not take without giving. It had given her a bridge between worlds, and that was enough to fill the empty horizon with hope again.'
                    }
                ],
                ar: [
                    {
                        id: 1,
                        tag: 'دهشة',
                        title: 'جامعة النجوم',
                        preview: 'لطالما كانت لونا مفتونة بسماء الليل. منذ صغرها كانت تتسلل إلى السطح وتعد النجوم. وفي إحدى الليالي سقط نجم في حديقتها الخلفية، وعندما التقطته شعرت بدفء وذكريات لم تكن لها...',

, un enfant qui ne se souvenait plus du visage de sa mère. Chaque fois que Luna rendait une étoile, le ciel au-dessus de son village scintillait un peu plus. Elle comprit que l’univers ne prend jamais vraiment rien ; il demande seulement quelqu’un d’assez courageux pour le rapporter.'

                    langLabel: 'Langue :',
                    storyTag: 'Histoire',
                    readMore: 'Lire la suite',
                    footerText: '✨ Story Haven — Confectionné avec soin · © 2026',
                    closeAria: 'Fermer l\'histoire',
                    darkmodeAria: 'Basculer le mode sombre',
                }
            };

            // DOM references
            const storiesGrid = document.getElementById('storiesGrid');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const darkmodeToggle = document.getElementById('darkmodeToggle');
            const langButtons = document.querySelectorAll('.lang-btn');
            const htmlElement = document.documentElement;
            const bodyElement = document.body;

            let currentLang = 'en';
            let isDarkMode = false;

            function updateUIText() {
                const translations = uiTranslations[currentLang];
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (translations[key]) el.textContent = translations[key];
                });
                darkmodeToggle.setAttribute('aria-label', translations.darkmodeAria);
                darkmodeToggle.setAttribute('title', translations.darkmodeAria);
                modalCloseBtn.setAttribute('aria-label', translations.closeAria);
            }

            function renderStoryCards() {
                const stories = storiesData[currentLang];
                const readMoreText = uiTranslations[currentLang].readMore;
                const storyTagText = uiTranslations[currentLang].storyTag;
                storiesGrid.innerHTML = '';

                stories.forEach((story, index) => {
                    const card = document.createElement('article');
                    card.className = 'story-card';
                    card.setAttribute('data-story-id', story.id);
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-label', `${storyTagText}: ${story.title}`);
                    card.innerHTML = `
                        <span class="card-number">${String(index+1).padStart(2,'0')}</span>
                        <span class="card-tag">${story.tag}</span>
                        <h3>${story.title}</h3>
                        <p class="preview">${story.preview}</p>
                        <span class="read-more-indicator">${readMoreText} <span class="arrow">→</span></span>
                    `;
                    card.addEventListener('click', () => openModal(story));
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(story); }
                    });
                    storiesGrid.appendChild(card);
                });
            }

            function openModal(story) {
                modalTitle.textContent = story.title;
                modalBody.textContent = story.full;
                const modalTag = document.querySelector('#modalContent .modal-tag');
                if (modalTag) modalTag.textContent = story.tag;
                modalOverlay.classList.add('active');
                bodyElement.style.overflow = 'hidden';
                setTimeout(() => modalCloseBtn.focus(), 100);
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                bodyElement.style.overflow = '';
            }

            function switchLanguage(lang) {
                if (lang === currentLang) return;
                currentLang = lang;
                htmlElement.setAttribute('lang', lang);
                htmlElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
                langButtons.forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
                });
                updateUIText();
                renderStoryCards();
                if (modalOverlay.classList.contains('active')) closeModal();
            }

            function toggleDarkMode() {
                isDarkMode = !isDarkMode;
                bodyElement.classList.toggle('dark-mode', isDarkMode);
                darkmodeToggle.textContent = isDarkMode ? '☀️' : '🌙';
                try { localStorage.setItem('storyHavenDarkMode', isDarkMode ? 'dark' : 'light'); } catch(e) {}
            }

            function loadDarkModePreference() {
                let preference = null;
                try { preference = localStorage.getItem('storyHavenDarkMode'); } catch(e) {}
                if (preference === 'dark') { isDarkMode = false; toggleDarkMode(); }
                else if (!preference && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
                    isDarkMode = false; toggleDarkMode();
                }
            }

            darkmodeToggle.addEventListener('click', toggleDarkMode);
            modalCloseBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModal(); });
            langButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const lang = btn.getAttribute('data-lang');
                    if (lang) switchLanguage(lang);
                });
            });
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    try { if (!localStorage.getItem('storyHavenDarkMode')) {
                        if (e.matches && !isDarkMode) toggleDarkMode();
                        else if (!e.matches && isDarkMode) toggleDarkMode();
                    }} catch(err) {}
                });
            }

            function init() {
                loadDarkModePreference();
                updateUIText();
                renderStoryCards();
                langButtons.forEach(btn => {
                    if (btn.getAttribute('data-lang') === currentLang) btn.classList.add('active');
                });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
